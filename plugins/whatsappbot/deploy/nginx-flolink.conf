# /etc/nginx/sites-available/flochat  (certbot adds the HTTPS parts)
# flolink.ai is the main site + app. www / flochat subdomains redirect to it,
# except the Meta webhook, the REST API and the Zoho callback, which keep working on the old address.
map $host $flo_old_host { default 0; www.flolink.ai 1; flochat.flolink.ai 1; }

upstream flochat_ofbiz { server 127.0.0.1:8453; keepalive 16; }

server {
    listen 80;
    server_name flolink.ai www.flolink.ai flochat.flolink.ai;
    client_max_body_size 20m;

    # integrations that must never be redirected (POSTs would break)
    location = /webhook { proxy_pass https://flochat_ofbiz; include /etc/nginx/snippets/flochat-proxy.conf; }
    location /api/      { proxy_pass https://flochat_ofbiz; include /etc/nginx/snippets/flochat-proxy.conf; }
    location = /control/zohoCallback { proxy_pass https://flochat_ofbiz; include /etc/nginx/snippets/flochat-proxy.conf; }

    location / {
        if ($flo_old_host) { return 301 https://flolink.ai$request_uri; }
        proxy_pass https://flochat_ofbiz;
        include /etc/nginx/snippets/flochat-proxy.conf;
    }
}
