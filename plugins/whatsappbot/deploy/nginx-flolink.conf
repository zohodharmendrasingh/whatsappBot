# /etc/nginx/sites-available/flochat
#   flolink.ai            -> product landing page (static, /var/www/flolink)
#   www.flolink.ai        -> redirects to flolink.ai
#   flochat.flolink.ai    -> FloChat app (OFBiz on 8453), unchanged address for Meta / Zoho / customers
#   app.flolink.ai        -> FlowLinker on Zoho Catalyst (GoDaddy CNAME, not served here)
upstream flochat_ofbiz { server 127.0.0.1:8453; keepalive 16; }

server {
    listen 80;
    server_name flolink.ai www.flolink.ai flochat.flolink.ai;
    location /.well-known/acme-challenge/ { root /var/www/flolink; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.flolink.ai;
    ssl_certificate /etc/letsencrypt/live/flochat.flolink.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flochat.flolink.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://flolink.ai$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flolink.ai;
    ssl_certificate /etc/letsencrypt/live/flochat.flolink.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flochat.flolink.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/flolink;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # links people may have saved while FloChat ran here for a few minutes
    location /control/ { return 301 https://flochat.flolink.ai$request_uri; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl http2;
    server_name flochat.flolink.ai;
    ssl_certificate /etc/letsencrypt/live/flochat.flolink.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flochat.flolink.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20m;
    location / {
        proxy_pass https://flochat_ofbiz;
        include /etc/nginx/snippets/flochat-proxy.conf;
    }
}
