###############################################################################
# WhatsApp Bot SaaS - platform level settings (one Meta app for all tenants,
# Tech Provider / Embedded Signup model). Per-tenant tokens live in WaChannel.
###############################################################################

# Meta Graph API
graph.api.base=https://graph.facebook.com
graph.api.version=v23.0
http.timeout.seconds=20

# Meta App (developers.facebook.com > App settings > Basic)
meta.app.id=2484887488701796
meta.app.secret=8cfcac93f3dd029b168cc3af640eb6c5
# Embedded Signup configuration id (Facebook Login for Business > Configurations)
meta.embedded.signup.config.id=1048501558221577

# Token you type in the Meta webhook setup screen (any random string)
webhook.verify.token=flochat-facb02c67f3ec423c98aa5b7
# Reject webhook POSTs without a valid X-Hub-Signature-256 (needs meta.app.secret)
webhook.require.signature=true

# Bot behaviour
bot.restart.keywords=menu,start,restart
bot.optout.keywords=stop,unsubscribe
bot.optin.keywords=start,subscribe
bot.max.auto.steps=10
bot.invalid.choice.text=Sorry, I didn't get that. Please choose one of the options.
bot.mark.inbound.read=true
saas.signup.enabled=true
saas.trial.days=14
saas.signup.default.plan=WA_STARTER
saas.signup.max.per.hour=5
